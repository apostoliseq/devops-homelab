server {
    listen 80;

    # Serve static files from this directory
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /shorten POST requests to the API container.
    # "api" is the service name in docker-compose — Docker's internal DNS
    # resolves it to the API container's IP automatically.
    location /shorten {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy short-code redirects (any path that isn't a static file) to the API.
    # The regex ~ means case-sensitive match. ^/[^/]+$ matches /aB3xYz but not /foo/bar.
    location ~ ^/[^/]+$ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
